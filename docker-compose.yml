services:
  shared-draw:
    build: .
    container_name: shared-draw
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8087:3000"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/draw.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
